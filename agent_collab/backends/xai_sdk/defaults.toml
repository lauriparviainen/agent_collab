# The xAI SDK backend is remote chat only and enables no tools.
[backends.xai_sdk]
enabled = false

[backends.xai_sdk.options]
model = "grok-4.6"
thinking_level = "high"

[usage_windows.targets.xai_sdk_grok_4_6]
enabled = false
backend = "xai_sdk"
model = "grok-4.6"

[usage_windows.targets.xai_sdk_grok_4_6.options]
thinking_level = "low"
